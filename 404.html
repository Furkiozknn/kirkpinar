<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı · Kırkpınar</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#140d05">
<style>
html,body{margin:0;height:100%;background:#140d05;color:#f7ecd6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;text-align:center;box-sizing:border-box}
h1{margin:0;font-size:clamp(28px,6vw,44px);color:#f5d78a}
p{margin:0;color:#cbb894;max-width:36ch;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:4px;border:2px solid #c89b3c;color:#f7ecd6;text-decoration:none;font-weight:700}
a.primary{background:#b0492f}
a:focus-visible{outline:2px solid #f5d78a;outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>Er meydanında yoksun bu sayfa</h1>
<p>Aradığın adres bulunamadı. Güreşe geri dönebilir ya da diğer oyunlara bakabilirsin.</p>
<div class="row"><a class="primary" href="https://furkiozknn.github.io/kirkpinar/">Kırkpınar'a dön</a><a href="https://furkiozknn.github.io/">Diğer oyunlar</a></div>
</main>
</body>
</html>
