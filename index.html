<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kırkpınar</title>
<meta name="description" content="A 3D physics oil-wrestling game from the Kırkpınar tradition: grip, pull and throw on the oiled grass, all the way to the golden belt. Plays in the browser.">
<meta property="og:type" content="website">
<meta property="og:title" content="Kırkpınar">
<meta property="og:description" content="A 3D physics oil-wrestling game from the Kırkpınar tradition: grip, pull and throw on the oiled grass, all the way to the golden belt. Plays in the browser.">
<meta property="og:url" content="https://furkiozknn.github.io/kirkpinar/">
<meta property="og:image" content="https://furkiozknn.github.io/kirkpinar/docs/card.jpg">
<meta property="og:image:width" content="960">
<meta property="og:image:height" content="540">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{
  --bg:#17120b; --ink:#f7ecd6; --ink2:#d4c3a2; --accent:#C2410C; --accent2:#e2602a; --gold:#E9B44C; --green:#7fb26a; --blue:#5b8def; --red:#e5533d;
  --glass:rgba(32,22,12,.66); --line:rgba(255,226,170,.16);
  --sa-t:env(safe-area-inset-top,0px); --sa-b:env(safe-area-inset-bottom,0px); --sa-l:env(safe-area-inset-left,0px); --sa-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;
  touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg{display:block}
.serif{font-family:Georgia,"Times New Roman",serif}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 32px rgba(0,0,0,.4)}

/* buttons */
.btn{min-height:46px;padding:10px 20px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.07);font-weight:700;font-size:16px;letter-spacing:.01em;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,transform .1s}
.btn:hover{background:rgba(255,255,255,.14)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,var(--accent2),var(--accent));border-color:rgba(255,200,140,.5);color:#fff;box-shadow:0 6px 18px rgba(194,65,12,.4)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.gold{background:linear-gradient(180deg,#f3cb6c,#c9902a);color:#2b1a05;border-color:rgba(255,235,170,.6)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn svg{width:20px;height:20px}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);font-weight:800;font-size:13px;position:relative}
.ibtn:hover{background:rgba(255,255,255,.1);border-color:var(--line)}
.ibtn.off{opacity:.5}
.ibtn svg{width:24px;height:24px}

/* HUD */
.topbar{position:fixed;top:calc(8px + var(--sa-t));left:calc(8px + var(--sa-l));right:calc(8px + var(--sa-r));min-height:56px;display:flex;align-items:center;gap:10px;padding:4px 58px 4px 12px;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--gold);white-space:nowrap}
.brand svg{width:30px;height:30px}
.brand span{font-size:19px;letter-spacing:.02em}
.stats{flex:1;display:flex;justify-content:center;align-items:center;gap:14px;font-size:14px;color:var(--ink2);min-width:0}
.chip{padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);white-space:nowrap;font-size:13px}
.chip b{color:var(--ink)}
.timer{font-size:26px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;min-width:68px;text-align:center;line-height:1}
.timer.low{color:var(--red)}
.timer small{display:block;font-size:10px;font-weight:700;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.score{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink)}
.acts{display:flex;gap:2px}
@media (max-width:760px){
  .topbar{flex-wrap:wrap;padding:4px 54px 4px 6px}
  .brand span{display:none}
  .stats{gap:8px;flex:1 1 auto;order:0}
  .chip.cls{display:none}
  .timer{font-size:22px}
}
.fbar{position:fixed;top:calc(74px + var(--sa-t));width:min(34vw,330px);padding:8px 12px;z-index:18;pointer-events:none}
.fbar.l{left:calc(8px + var(--sa-l))}.fbar.r{right:calc(8px + var(--sa-r));text-align:right}
.fbar .nm{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.fbar.r .nm{flex-direction:row-reverse}
.fbar .dot{width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.7);flex:none}
.fbar .pts{margin-left:auto;font-size:18px;font-weight:800;color:var(--gold)}
.fbar.r .pts{margin-left:0;margin-right:auto}
.fbar .lab{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-top:5px;display:flex;justify-content:space-between}
.meter{height:9px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;position:relative;margin-top:2px}
.meter i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:5px;background:linear-gradient(90deg,#e2602a,#e9b44c);transition:width .1s}
.fbar.r .meter i{left:auto;right:0}
.meter.grip i{background:linear-gradient(90deg,#5b8def,#8fe0c8)}
.meter.low i{background:linear-gradient(90deg,#b91c1c,#e5533d)}
@media (max-width:760px){.fbar{width:44vw;top:calc(68px + var(--sa-t));padding:6px 8px}.fbar .nm{font-size:13px}.fbar .lab{display:none}}
.bubble{position:fixed;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:2px solid rgba(255,240,210,.55);background:radial-gradient(circle,rgba(0,0,0,.28),rgba(0,0,0,.5));z-index:15;pointer-events:none;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.bubble::before,.bubble::after{content:"";position:absolute;background:rgba(255,240,210,.25)}
.bubble::before{left:50%;top:6px;bottom:6px;width:1px}.bubble::after{top:50%;left:6px;right:6px;height:1px}
.bubble i{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#7fe29a;box-shadow:0 0 8px currentColor;transition:background .15s}
.bubble.warn i{background:#f0c040}.bubble.bad i{background:#ee5a44}
.bubble .gt{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);font-size:10px;font-weight:700;white-space:nowrap;color:var(--ink2);letter-spacing:.04em}
@media (max-width:760px){.bubble{width:42px;height:42px;margin:-21px 0 0 -21px}.bubble i{width:13px;height:13px;margin:-6px 0 0 -6px}}
#prompt{position:fixed;left:50%;bottom:calc(150px + var(--sa-b));transform:translateX(-50%) scale(.9);padding:10px 22px;z-index:22;font-weight:800;font-size:20px;letter-spacing:.02em;opacity:0;pointer-events:none;transition:opacity .12s,transform .12s;border-color:rgba(255,200,120,.7);display:flex;gap:12px;align-items:center;white-space:nowrap}
#prompt.on{opacity:1;transform:translateX(-50%) scale(1);box-shadow:0 0 0 2px var(--gold),0 0 34px rgba(233,180,76,.55)}
#prompt kbd,.kbd{display:inline-block;min-width:28px;padding:2px 8px;border-radius:7px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.14);font:700 14px/1.4 ui-monospace,Consolas,monospace;text-align:center}
#prompt.p2 kbd{opacity:.9}
@media (hover:none){#prompt kbd{display:none}#prompt{bottom:calc(210px + var(--sa-b))}}
#toasts{position:fixed;top:calc(140px + var(--sa-t));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:25;pointer-events:none;width:min(90vw,460px)}
.toast{padding:7px 16px;border-radius:12px;font-weight:700;font-size:15px;animation:tin .25s ease-out;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px)}
.toast.good{border-color:rgba(127,178,106,.8);color:#cdf2bd}.toast.bad{border-color:rgba(229,83,61,.8);color:#ffc7bd}.toast.info{color:var(--ink)}
.toast.out{opacity:0;transform:translateY(-6px);transition:all .3s}
@keyframes tin{from{opacity:0;transform:translateY(-8px) scale(.96)}to{opacity:1;transform:none}}
#subs{position:fixed;left:50%;bottom:calc(40px + var(--sa-b));transform:translateX(-50%);width:min(92vw,720px);text-align:center;z-index:19;pointer-events:none}
#subs div{display:inline-block;padding:7px 16px;border-radius:12px;background:rgba(10,6,2,.66);color:#fff3d6;font-size:17px;font-family:Georgia,serif;font-style:italic;line-height:1.35;transition:opacity .4s}
#subs small{display:block;font-style:normal;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-family:system-ui,sans-serif;margin-bottom:1px}
@media (hover:none){#subs{bottom:calc(228px + var(--sa-b))}}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;z-index:24;pointer-events:none;font-family:Georgia,serif;font-weight:800;font-size:clamp(40px,9vw,92px);color:#fff;text-shadow:0 4px 0 #7c2d0a,0 10px 30px rgba(0,0,0,.6);opacity:0;letter-spacing:.02em}
#banner.on{animation:ban 1.3s ease-out forwards}
@keyframes ban{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.08)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.04)}}
#hintline{position:fixed;left:50%;bottom:calc(8px + var(--sa-b));transform:translateX(-50%);z-index:19;font-size:12.5px;color:var(--ink2);padding:5px 14px;border-radius:999px;background:rgba(10,6,2,.5);white-space:nowrap;pointer-events:none}
@media (hover:none),(max-width:700px){#hintline{display:none}}
.replaytag{position:fixed;top:calc(80px + var(--sa-t));left:50%;transform:translateX(-50%);z-index:26;padding:8px 18px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);display:flex;gap:14px;align-items:center}
.replaytag .rec{width:10px;height:10px;border-radius:50%;background:var(--red);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

/* touch controls */
#touch{position:fixed;left:0;right:0;bottom:0;height:200px;z-index:21;pointer-events:none}
#stick{position:absolute;left:calc(14px + var(--sa-l));bottom:calc(14px + var(--sa-b));width:156px;height:156px;border-radius:50%;background:rgba(255,255,255,.09);border:2px solid rgba(255,240,210,.3);pointer-events:auto;touch-action:none}
#stick i{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:rgba(255,240,210,.3);border:2px solid rgba(255,240,210,.6)}
#stick span{position:absolute;font-size:11px;font-weight:800;color:rgba(255,240,210,.7);letter-spacing:.06em}
#stick .u{top:5px;left:50%;transform:translateX(-50%)}#stick .d{bottom:5px;left:50%;transform:translateX(-50%)}
.tbtns{position:absolute;right:calc(10px + var(--sa-r));bottom:calc(12px + var(--sa-b));display:grid;grid-template-columns:repeat(2,76px);gap:10px;pointer-events:auto}
.tb{height:70px;border-radius:18px;border:2px solid rgba(255,240,210,.4);background:rgba(40,26,12,.62);font-weight:800;font-size:14px;line-height:1.1;touch-action:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink)}
.tb svg{width:26px;height:26px}
.tb.on{background:rgba(194,65,12,.7);border-color:#fff}
.tb.ctx{border-color:var(--gold)}
.tb.ctx.lit{background:linear-gradient(180deg,#f3cb6c,#c9902a);color:#2b1a05;box-shadow:0 0 22px rgba(233,180,76,.8)}
@media (max-height:480px){#stick{width:120px;height:120px}.tbtns{grid-template-columns:repeat(4,64px)}.tb{height:58px}#touch{height:140px}}

/* screens */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--sa-t)) 12px calc(12px + var(--sa-b));z-index:40;overflow:auto;touch-action:pan-y}
.screen.dim{background:rgba(12,8,3,.62);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.screen.grad{background:radial-gradient(ellipse at 50% 30%,rgba(23,14,6,.35),rgba(10,6,2,.82))}
.panel{width:min(94vw,560px);padding:22px 24px;max-height:calc(100vh - 24px);overflow:auto}
.panel.wide{width:min(96vw,860px)}
.panel h2{margin:0 0 4px;font-family:Georgia,serif;font-size:28px;color:var(--gold)}
.panel p.sub{margin:0 0 14px;color:var(--ink2);font-size:14px;line-height:1.45}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.title-wrap{text-align:center;max-width:620px;width:100%}
.crest{width:min(46vw,210px);height:auto;margin:0 auto 4px;filter:drop-shadow(0 10px 22px rgba(0,0,0,.55))}
.title-wrap h1{margin:0;font-family:Georgia,serif;font-size:clamp(46px,9vw,84px);letter-spacing:.02em;color:#fff;text-shadow:0 4px 0 #7c2d0a,0 12px 34px rgba(0,0,0,.6);line-height:1}
.title-wrap .tag{margin:6px 0 12px;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:13px;font-weight:700}
.title-wrap .how{margin:0 auto 16px;max-width:520px;color:var(--ink);font-size:14.5px;line-height:1.5;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.menu{display:flex;flex-direction:column;gap:10px;align-items:center;width:min(86vw,320px);margin:0 auto}
.menu .btn{width:100%}
.menu .row{width:100%}.menu .row .btn{flex:1}
.best{margin-top:12px;font-size:13px;color:var(--ink2);text-shadow:0 2px 8px rgba(0,0,0,.8)}
.foot{position:fixed;left:0;right:0;bottom:calc(8px + var(--sa-b));text-align:center;font-size:12px;color:var(--ink2);z-index:41;text-shadow:0 1px 6px #000}
.foot a{color:var(--gold);text-decoration:none;padding:6px 4px}
.foot a:hover{text-decoration:underline}
.loadbar{width:min(70vw,300px);height:8px;border-radius:4px;background:rgba(255,255,255,.12);margin:10px auto 0;overflow:hidden}
.loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--gold));transition:width .2s}
.field{display:flex;align-items:center;gap:12px;margin:8px 0;font-size:15px}
.field label{flex:0 0 120px;color:var(--ink2)}
.field input[type=range]{flex:1;min-height:44px;accent-color:var(--accent2)}
.field .val{width:40px;text-align:right;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-height:44px;padding:8px 16px;border:0;background:transparent;font-weight:700}
.seg button.on{background:var(--accent);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}
.card{padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.06);text-align:left;min-height:96px}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset;background:rgba(233,180,76,.12)}
.card b{display:block;font-size:16px}.card small{color:var(--ink2);display:block;margin-top:3px;font-size:12.5px;line-height:1.35}
.statbars{margin-top:6px;display:grid;gap:3px}
.statbars div{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink2)}
.statbars span{width:34px}.statbars em{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;display:block}.statbars em i{display:block;height:100%;background:var(--gold)}

/* ladder */
.ladder{display:flex;flex-direction:column-reverse;gap:8px;margin:8px 0 14px}
.rung{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.rung .badge{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:rgba(255,255,255,.1);flex:none}
.rung.done .badge{background:var(--green);color:#10260a}
.rung.cur{border-color:var(--gold);background:rgba(233,180,76,.12)}
.rung.cur .badge{background:var(--gold);color:#2b1a05}
.rung.locked{opacity:.55}
.rung .nm{font-weight:800;font-family:Georgia,serif;font-size:18px}
.rung .ops{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.rung .op{font-size:12px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line)}
.rung .op.d{background:rgba(127,178,106,.25);text-decoration:line-through;opacity:.8}
.rung .op.c{border-color:var(--gold);color:var(--gold)}
.beltrow{display:flex;align-items:center;gap:14px;padding:12px;border-radius:14px;border:1px solid rgba(233,180,76,.6);background:linear-gradient(180deg,rgba(233,180,76,.2),rgba(233,180,76,.05));margin-bottom:6px}
.beltrow svg{width:96px;height:48px;flex:none}
.beltrow b{font-family:Georgia,serif;font-size:20px;color:var(--gold)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:12px 0}
.vs .who{text-align:center}.vs .who b{display:block;font-size:20px;font-family:Georgia,serif}
.vs .who small{color:var(--ink2);display:block}
.vs .x{font-size:30px;font-weight:800;color:var(--accent2);font-family:Georgia,serif}
.vs .swatch{width:46px;height:46px;border-radius:50%;margin:0 auto 6px;border:3px solid rgba(255,255,255,.7)}
.res h2{font-size:34px}
.res .how{color:var(--gold);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:12px 0}
.kv div{padding:10px;border-radius:12px;background:rgba(255,255,255,.06);border:1px solid var(--line);text-align:center}
.kv b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.kv small{color:var(--ink2);font-size:11.5px}
.newrec{color:var(--gold);font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:13px;margin-top:4px}
.keys{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}
.keys td{padding:4px 6px;border-bottom:1px solid var(--line)}.keys td:first-child{color:var(--ink2);width:34%}
@media (min-width:900px) and (min-aspect-ratio:3/2){#s-title{justify-content:flex-start;padding-left:6vw}#s-title .title-wrap{width:min(44vw,560px)}}
/* v2: global mute, coach strip, belt hall, oil tick, fact cards */
#bMute{position:fixed;top:calc(14px + var(--sa-t));right:calc(12px + var(--sa-r));z-index:45;background:rgba(32,22,12,.5);border-color:var(--line)}
#bMute.off{opacity:.7;color:var(--gold)}
#hud{--coach-top:74px}
@media (max-width:1080px){#hud{--coach-top:190px}}
@media (max-width:760px){#hud{--coach-top:144px}}
#coach{position:fixed;top:calc(var(--coach-top) + var(--sa-t));left:50%;transform:translateX(-50%);width:clamp(300px,calc(100vw - 2*min(34vw,330px) - 40px),440px);z-index:19;padding:8px 10px}
@media (max-width:1080px){#coach{width:min(94vw,440px)}}
#coach .cs{display:flex;gap:6px;justify-content:space-between}
.cstep{flex:1;display:flex;align-items:center;gap:6px;padding:4px 8px 4px 4px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink2);white-space:nowrap;min-width:0}
.cstep i{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;background:rgba(255,255,255,.14);color:var(--ink)}
.cstep i svg{width:14px;height:14px}
.cstep.on{border-color:var(--gold);color:var(--ink);background:rgba(233,180,76,.16)}
.cstep.on i{background:var(--gold);color:#2b1a05}
.cstep.ok{color:#cdf2bd;border-color:rgba(127,178,106,.7)}
.cstep.ok i{background:var(--green);color:#10260a}
#coach .cd{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:14px;font-weight:700;color:var(--ink)}
#coach .cd span{flex:1;line-height:1.3}
#coach .cd .btn{min-height:44px;padding:6px 12px;font-size:13px;flex:none}
#hud.coachOn #toasts{top:calc(var(--coach-top) + 112px + var(--sa-t))}

    $('#endingBox').innerHTML = `<div style="width:min(70vw,240px);margin:0 auto 8px">${beltSvg(store.belt.kept)}</div><h2 style="font-size:40px">${t('endTitle')}</h2><p class="sub">${t('endSub')}</p>${beltHallHtml(store.belt.streak)}<div class="kv"><div><b>${store.best.titles}</b><small>${t('endTitles')}</small></div><div><b>${store.best.wins}</b><small>${t('bestWins')}</small></div></div><div class="row c">${menuBtn('title', t('menu'), 'primary')}</div>`;
  };
  G.lastEndingFn(); showScreen('ending'); G.screen = 'ending'; startConfetti(); say('win', true, G.cfg.specs[0].name); $('#hud').classList.add('nofb');
}
let confettiRun = 0;
function startConfetti() {
  const c = $('#confetti'); if (!c) return; const ctx = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight; const run = ++confettiRun;
  const ps = Array.from({ length: 120 }, () => ({ x: Math.random() * c.width, y: -Math.random() * c.height, vx: (Math.random() - 0.5) * 2, vy: 2 + Math.random() * 3, r: 4 + Math.random() * 5, c: ['#E9B44C', '#C2410C', '#f7ecd6', '#2a7f62', '#2563EB'][(Math.random() * 5) | 0], a: Math.random() * 6 }));
  (function loop() {
    if (run !== confettiRun || G.screen !== 'ending') { ctx.clearRect(0, 0, c.width, c.height); return; }
    ctx.clearRect(0, 0, c.width, c.height);
    for (const p of ps) { p.x += p.vx; p.y += p.vy; p.a += 0.08; if (p.y > c.height + 10) { p.y = -10; p.x = Math.random() * c.width; } ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); }
    requestAnimationFrame(loop);
  })();
}

// ============================================================ camera + render
const camTmp = new THREE.Vector3(), lookTmp = new THREE.Vector3();
function updateCamera(dt) {
  const M = G.match; if (!M) return;
  const [a, b] = M.f, tv = Math.tan(camera.fov * Math.PI / 360), asp = camera.aspect;
  G.camT += dt;
  if (G.replay) {
    const rp = G.replay, J = G.rec[(rp.start + Math.min(rp.n - 1, Math.floor(rp.pos))) % REC_N][rp.loser];
    lookTmp.set(J[0], 0.8, J[2]); rp.ang += dt * 0.28;
    const d = 4.4; camTmp.set(lookTmp.x + Math.sin(rp.ang) * d * 0.7, 1.5, lookTmp.z + Math.cos(rp.ang) * d);
    camera.position.lerp(camTmp, 0.12); camera.lookAt(lookTmp); return;
  }
  if (G.demo || G.screen === 'title' || G.screen === 'mode' || G.screen === 'quick' || G.screen === 'ladder' || G.screen === 'versus') {
    const ang = Math.sin(G.camT * 0.12) * 0.55, cx = (a.p.x + b.p.x) / 2;
    const d = 6.2 + (asp < 1 ? 5 : 0);
    const off = G.screen === 'title' && asp > 1.5 ? 2.5 : 0;
    camTmp.set(cx + Math.sin(ang) * d - off, 1.7, Math.cos(ang) * d); camera.position.lerp(camTmp, Math.min(1, dt * 2)); lookTmp.set(cx - off, 1.05, 0); camera.lookAt(lookTmp);
    return;
  }
  const span = Math.max(4.6, Math.abs(a.p.x - b.p.x) + 2.8);
  let dist = Math.max(1.85 / tv, (span / 2) / (tv * asp), 5.4) * (1 - 0.14 * Math.min(1, G.zoom)) * (G.slowT > 0 ? 0.82 : 1);
  const cx = (a.p.x + b.p.x) / 2;
  G.camX += (cx - G.camX) * Math.min(1, dt * 4); G.camDist += (dist - G.camDist) * Math.min(1, dt * 2.6);
  const sh = G.shake; G.shake = Math.max(0, G.shake - dt * 1.6);
  const ly = asp < 1 || IS_TOUCH ? 0.62 : 1.05;
  camera.position.set(G.camX + (Math.random() - 0.5) * sh * 0.25, 1.35 + 0.15 * G.camDist + (Math.random() - 0.5) * sh * 0.2, G.camDist);
  camera.lookAt(G.camX, ly, 0);
}
const _pv = new THREE.Vector3();
function projectTo(el, x, y, z, dy) {
  _pv.set(x, y, z).project(camera); const sx = (_pv.x * 0.5 + 0.5) * innerWidth, sy = (-_pv.y * 0.5 + 0.5) * innerHeight;
  el.style.left = sx + 'px'; el.style.top = (sy + dy) + 'px';
}
function updateHUD() {
  const M = G.match; if (!M || $('#hud').hidden) return;
  const left = M.golden ? M.goldenLimit - M.clock : M.limit - M.clock;
  const tm = $('#hTime'); tm.firstChild.nodeValue = fmtTime(M.phase === 'ready' ? (M.golden ? M.goldenLimit : M.limit) : left); tm.classList.toggle('low', left < 10 && M.phase === 'play');
  $('#hGold').textContent = M.golden ? t('golden') : '';
  for (let i = 0; i < 2; i++) {
    const f = M.f[i], b = $('#fb' + i);
    b.querySelector('.st i').style.width = Math.round(f.sta * 100) + '%'; b.querySelector('.st').classList.toggle('low', f.sta < 0.25);
    let g = 0, c = 0; for (const h of f.h) if (h.t) { g += clamp(h.capF, 0, 1); c++; }
    const gv = c ? g / c : 0; b.querySelector('.gr i').style.width = Math.round(gv * 100) + '%'; b.querySelector('.gr').classList.toggle('low', c > 0 && gv < 0.3);
    b.querySelector('.pts').textContent = f.score;
    // oil limit: the grip bar cannot fill past this tick, and the tick creeps inward as both wrestlers get slicker
    const oilLim = clamp(1 - 0.55 * 0.8 * (M.f[0].oil + M.f[1].oil) * 0.5, 0, 1) * 100;
    b.querySelector('.oil').style[i === 0 ? 'left' : 'right'] = oilLim.toFixed(1) + '%';
    // balance bubble
    const bb = $('#bb' + i), L = SIMLIB.leanLimit(f);
    projectTo(bb, f.p.x, 0, f.p.z, 34);
    const dx = clamp(f.lean.x / (L * 1.1), -1, 1) * 18, dz = clamp(f.lean.z / (L * 1.1), -1, 1) * 18, ok = f.state === 'stand' || f.state === 'carry';
    const dot = bb.querySelector('i'); dot.style.transform = `translate(${ok ? dx : 0}px,${ok ? dz : 0}px)`;
    bb.classList.toggle('warn', ok && f.bal < 0.6 && f.bal >= 0.35); bb.classList.toggle('bad', !ok || f.bal < 0.35); bb.style.opacity = M.phase === 'ready' ? 0.5 : 1;
  }
  $('#hScore').textContent = ptsOf(M);
  // prompts
  const p1 = prompt1, p2 = prompt2, vs = G.versus;
  p1.classList.toggle('v', vs);
  const h0 = M.f[0].hint && isHuman(0) && M.phase === 'play', h1 = M.f[1].hint && isHuman(1) && M.phase === 'play';
  p1.classList.toggle('on', !!h0); if (h0) { $('#pTxt').textContent = t(M.f[0].hint); $('#pKey').textContent = 'R'; }
  prompt2.style.opacity = h1 ? 1 : 0; prompt2.style.transform = h1 ? 'translateX(-50%) scale(1)' : 'translateX(-50%) scale(.9)'; if (h1) { $('#pTxt2').textContent = t(M.f[1].hint); $('#pKey2').textContent = 'Enter'; }
  if (!vs) prompt2.style.opacity = 0;
}
function recordFrame() {
  const M = G.match; if (!G.recOn || !M) return;
  const slot = G.rec[G.recN % REC_N]; slot[0].set(M.f[0].rig.J); slot[1].set(M.f[1].rig.J); G.recHead = G.recN + 1; G.recN++;
}
function renderFrame(dt, nowS) {
  const M = G.match; if (!M) { renderer.render(scene, camera); return; }
  if (G.replay) {
    const rp = G.replay; rp.pos += dt * 60 * 0.42;
    const idx = (rp.start + Math.min(rp.n - 1, Math.floor(rp.pos))) % REC_N;
    for (let i = 0; i < 2; i++) { M.f[i].rig.J.set(G.rec[idx][i]); applyJ(M.f[i].rig, M.f[i].rig.J); }
    if (rp.pos >= rp.n + 8) endReplay();
  } else {
    for (let i = 0; i < 2; i++) { const f = M.f[i]; solvePose(f, M.f[1 - i], f.rig, M, nowS, dt); applyJ(f.rig, f.rig.J); }
    recordFrame();
  }
  // oil: skin gets glossier as sweat and oil build up; the ground darkens where they stand
  let oilSum = 0;
  for (let i = 0; i < 2; i++) {
    const f = M.f[i], r = f.rig, u = clamp((f.oil - 0.4) / 0.5, 0, 1); oilSum += u;
    r.skinM.roughness = lerp(0.58, 0.14, u); r.skinM.envMapIntensity = lerp(0.8, 2.2, u);
    r.headM.roughness = lerp(0.62, 0.2, u); r.headM.envMapIntensity = lerp(0.8, 1.8, u);
  }
  oilMat.opacity = 0.4 + 0.3 * oilSum * 0.5;
  // lighting follows the pair
  const cx = (M.f[0].p.x + M.f[1].p.x) / 2; sun.position.set(cx - 7, 13, 8); sun.target.position.set(cx, 0, 0); sun.target.updateMatrixWorld();
  updateCrowd(nowS, G.excite); updateParticles(dt);
  for (const fl of flagMeshes) {
    const pa = fl.m.geometry.attributes.position, b = fl.base;
    for (let i = 0; i < pa.count; i++) { const x = b[i * 3], y = b[i * 3 + 1]; pa.setZ(i, Math.sin(x * 3.2 - nowS * 4 + fl.ph) * 0.2 * (x / 1.7)); pa.setY(i, y + Math.sin(x * 2 - nowS * 3 + fl.ph) * 0.04 * (x / 1.7)); }
    pa.needsUpdate = true;
  }
  clouds.forEach((c, i) => { c.position.x += dt * (0.6 + i * 0.1); if (c.position.x > 180) c.position.x = -180; });
  const talkTarget = G.talk ? 1 : 0; G.talkS = (G.talkS || 0) + (talkTarget - (G.talkS || 0)) * 0.1;
  const away = !G.demo && M.phase !== 'ready' ? 1 : 0;
  updateNPCs(nowS, { talk: G.talkS, x: away ? 0.5 : 0, z: away ? -8.5 : -3.4 });
  if (AU.crowdG) AU.crowdG.gain.value = 0.03 + G.excite * 0.14;
  updateCamera(dt);
  updateHUD();
  renderer.render(scene, camera);
}

// ============================================================ main loop
let lastT = 0, fpsAcc = 0, fpsN = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastT) / 1000 || 0.016); lastT = now;
  fpsAcc += dt; fpsN++; if (fpsAcc >= 0.5) { G.fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; if (DEBUG) debugOut(); }
  if (document.hidden) return;
  G.time += dt;
  if (G.vsAuto > 0) {
    if (G.screen === 'versus') {
      G.vsAuto -= dt; const bar = $('#vsAutoI'); if (bar) bar.style.width = Math.max(0, G.vsAuto / 2.5 * 100) + '%';
      if (G.vsAuto <= 0) { G.vsAuto = 0; onAct('vsGo'); }
    } else G.vsAuto = 0;
  }
  if (!G.paused && G.screen !== 'pause') {
    const slow = G.slowT > 0 ? 0.3 : 1, spd = AUTO ? (+Q.get('fast') || 6) : 1;
    G.acc += dt * slow * spd;
    let n = 0; while (G.acc >= DT && n < 40) { G.acc -= DT; if (!G.replay) simStep(DT); n++; }
  }
  renderFrame(dt, G.time);
}
function debugOut() {
  const d = $('#dbg'); d.hidden = false; const M = G.match;
  d.textContent = `fps ${G.fps}  calls ${renderer.info.render.calls}  tris ${renderer.info.render.triangles}\n${M ? M.f.map(f => f.state + ' b' + f.bal.toFixed(2) + ' s' + f.sta.toFixed(2)).join(' | ') + ' ph:' + M.phase + ' t:' + M.clock.toFixed(0) : ''}\n${(window.__errs || []).slice(-3).join('\n')}`;
}
addEventListener('resize', resize);
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  pMat.uniforms.scale.value = h * renderer.getPixelRatio() / (2 * Math.tan(camera.fov * Math.PI / 360));
}

// ============================================================ auto bot (self test)
function finishAutoMatch() {
  const M = G.match, R = M.result, st = G.autoStats; st.matches++; if (R.winner === 0) st.wins++; else st.losses++; st.hows[R.how] = (st.hows[R.how] || 0) + 1;
  showResult(); // exercise the real result screen
  setTimeout(() => {
    const cont = $('#resultBox [data-act="ending"]') || $('#resultBox [data-act="nextmatch"]') || $('#resultBox [data-act="retry"]') || $('#resultBox [data-act="rematch"]');
    if (cont) cont.click();
  }, 120);
}
function autoDriver() {
  const st = G.autoStats; if (st.done) return;
  const s = G.screen;
  if (s === 'title' && G.ready) { const b = Q.get('mode') === 'quick' ? $('#bMore') : $('#bPlay'); if (b && !b.hidden) b.click(); }
  else if (s === 'mode') { if (Q.get('mode') === 'quick') $('[data-act="quickcfg"]').click(); else $('[data-act="career"]').click(); }
  else if (s === 'quick') { $('[data-act="qstart"]').click(); }
  else if (s === 'ladder') { $('[data-act="ladderGo"]').click(); }
  else if (s === 'versus') { $('[data-act="vsGo"]').click(); }
  else if (s === 'ending') { st.done = true; st.titles = store.best.titles; }
  else if (s === 'result' && G.match && G.match.result && Q.get('mode') === 'quick') { st.done = true; }
}

// ============================================================ boot
function boot() {
  settings.quality = settings.quality === 'high' ? 'high' : 'low';
  buildScreens(); resize(); applyQuality(); syncSoundBtn();
  showScreen('title');
  startDemo();
  const bar = () => $('#loadI'); let step = 0; const N = 3;
  const adv = (label) => { step++; const b = bar(); if (b) b.style.width = Math.round(step / N * 100) + '%'; const lt = $('#loadTxt'); if (lt) lt.textContent = t('loading') + ' ' + step + '/' + N; };
  adv(); // world built
  requestAnimationFrame(() => {
    try { renderer.compile(scene, camera); } catch (e) { /* compiled lazily instead */ }
    adv();
    setTimeout(() => {
      adv(); G.ready = true; const lb = $('#loadBox'); if (lb) lb.hidden = true; const p = $('#bPlay'); if (p) { p.hidden = false; } const c = $('#bCont'); if (c) c.hidden = false;
      if (p && !AUTO) p.focus();
    }, 60);
  });
  requestAnimationFrame(frame);
  if (AUTO) setInterval(autoDriver, 400);
  const dtab = () => { const b = $('#bPlay'); };
  window.kirkpinar = {
    get state() { const M = G.match; return M ? { phase: M.phase, clock: M.clock, limit: M.limit, limits: CLASS_LIMIT, golden: M.golden, score: [M.f[0].score, M.f[1].score], states: M.f.map(f => f.state), bal: M.f.map(f => +f.bal.toFixed(2)), sta: M.f.map(f => +f.sta.toFixed(2)), result: M.result } : null; },
    get screen() { return G.screen; }, get fps() { return G.fps; }, get drawCalls() { return renderer.info.render.calls; }, get triangles() { return renderer.info.render.triangles; },
    assets: G.assets, auto: G.autoStats, G, store, version: '2.0', get coach() { return G.coach; }, get belt() { return store.belt; }, limits: CLASS_LIMIT, facts: FACTS.length, get errors() { return window.__errs || []; }, quality: () => settings.quality, humans: G.humans
  };
}
boot();
