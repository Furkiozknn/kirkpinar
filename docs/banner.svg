<ellipse cx="1030" cy="306" rx="34" ry="6" fill="#000" opacity=".25"/>
<rect x="1010" y="266" width="40" height="36" rx="10" fill="#402820"/>
<path d="M1006 216 q24 -10 48 0 l4 52 h-56 z" fill="#D89068"/>
<circle cx="1030" cy="200" r="22" fill="#D89068"/>
<path d="M1010 196 q20 -22 40 0 q-20 -8 -40 0 z" fill="#502820"/>
<circle cx="1022" cy="202" r="3" fill="#281808"/><circle cx="1038" cy="202" r="3" fill="#281808"/>
