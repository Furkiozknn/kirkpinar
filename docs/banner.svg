<path d="M1060 196 q4 8 0 14" stroke="#9fd0e0" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
</g>
</g>
<!-- text panel -->
<rect width="760" height="320" fill="url(#fade)" clip-path="url(#card)"/>
<g font-family="Georgia, 'Times New Roman', serif">
<text x="56" y="62" font-size="18" letter-spacing="3" fill="#F8F0E0">TURKISH IS EASY… WITH OIL?</text>
<rect x="56" y="72" width="330" height="3" fill="#E02028"/>
<text x="52" y="168" font-size="96" font-weight="700" letter-spacing="2" fill="#F8F0E0">KIRKPINAR</text>
<text x="56" y="214" font-size="26" letter-spacing="1" fill="#E0A038">Yağlı güreş · Edirne</text>
<text x="56" y="256" font-size="20" fill="#F8F0E0" opacity=".9">Yağlan, yaklaş, tut. Sırtı çimene değsin.</text>
</g>
<g font-family="Georgia, 'Times New Roman', serif">
<rect x="56" y="272" width="214" height="34" rx="17" fill="#E0A038"/>
<text x="163" y="295" font-size="17" font-weight="700" text-anchor="middle" fill="#281808">▶ OYNA · PLAY</text>
<text x="290" y="295" font-size="15" fill="#988878">furkiozknn.github.io/kirkpinar</text>
</g>
