<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
<title id="t">Kırkpınar · oyun şarkısı stili / song-video style</title>
<desc id="d">Banner for Kırkpınar in the style of its song video: dark brown ground, golden title, cream serif lettering, a mown green field with a stylized moustached pehlivan and a small sweating boy wrestler, red crowd flags and a thin red rule under the tagline.</desc>
<defs>
<clipPath id="card"><rect width="1280" height="320" rx="24"/></clipPath>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#281808"/><stop offset="1" stop-color="#4a2a10"/></linearGradient>
<linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#281808"/><stop offset=".55" stop-color="#281808" stop-opacity=".92"/><stop offset="1" stop-color="#281808" stop-opacity="0"/></linearGradient>
</defs>
<g clip-path="url(#card)">
<rect width="1280" height="320" fill="url(#sky)"/>
<!-- crowd: small heads with red flags -->
<g opacity=".9">
<g fill="#502820"><circle cx="720" cy="112" r="11"/><circle cx="752" cy="106" r="11"/><circle cx="790" cy="114" r="11"/><circle cx="826" cy="108" r="11"/><circle cx="862" cy="113" r="11"/><circle cx="900" cy="107" r="11"/><circle cx="936" cy="114" r="11"/><circle cx="974" cy="108" r="11"/><circle cx="1012" cy="113" r="11"/><circle cx="1050" cy="106" r="11"/><circle cx="1090" cy="113" r="11"/><circle cx="1128" cy="107" r="11"/><circle cx="1168" cy="114" r="11"/><circle cx="1208" cy="108" r="11"/><circle cx="1248" cy="113" r="11"/></g>
<g fill="#D89068"><circle cx="736" cy="130" r="10"/><circle cx="772" cy="128" r="10"/><circle cx="808" cy="131" r="10"/><circle cx="844" cy="128" r="10"/><circle cx="880" cy="131" r="10"/><circle cx="918" cy="128" r="10"/><circle cx="956" cy="131" r="10"/><circle cx="994" cy="128" r="10"/><circle cx="1030" cy="131" r="10"/><circle cx="1068" cy="128" r="10"/><circle cx="1108" cy="131" r="10"/><circle cx="1146" cy="128" r="10"/><circle cx="1186" cy="131" r="10"/><circle cx="1226" cy="128" r="10"/></g>
<g fill="#E02028"><rect x="800" y="86" width="22" height="14" rx="2"/><rect x="940" y="82" width="22" height="14" rx="2"/><rect x="1086" y="86" width="22" height="14" rx="2"/><rect x="1196" y="82" width="22" height="14" rx="2"/></g>
</g>
<!-- field -->
<rect y="168" width="1280" height="152" fill="#687028"/>
<g fill="#586020"><rect y="168" width="1280" height="20"/><rect y="228" width="1280" height="26"/><rect y="290" width="1280" height="30"/></g>
<rect y="168" width="1280" height="4" fill="#F8F0E0" opacity=".85"/>
<!-- big pehlivan -->
<g>
<ellipse cx="930" cy="304" rx="64" ry="9" fill="#000" opacity=".25"/>
<rect x="888" y="256" width="84" height="46" rx="14" fill="#402820"/>
<path d="M880 170 q50 -18 100 0 l8 90 h-116 z" fill="#D89068"/>
<circle cx="930" cy="146" r="34" fill="#D89068"/>
<path d="M896 138 q34 -22 68 0 l-6 8 q-28 -10 -56 0 z" fill="#502820"/>
<path d="M902 160 q28 18 56 0 q-4 12 -28 12 q-24 0 -28 -12 z" fill="#502820"/>
<circle cx="918" cy="146" r="3.5" fill="#281808"/><circle cx="942" cy="146" r="3.5" fill="#281808"/>
<path d="M870 188 q-14 36 14 56" stroke="#D89068" stroke-width="16" fill="none" stroke-linecap="round"/>
<path d="M990 188 q14 36 -14 56" stroke="#D89068" stroke-width="16" fill="none" stroke-linecap="round"/>
<path d="M900 188 q-8 18 -2 30" stroke="#F8F0E0" stroke-width="3" fill="none" opacity=".35" stroke-linecap="round"/>
</g>
<!-- small boy -->
